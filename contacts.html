<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты | ЗвукоСлово</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:Arial,sans-serif;background:#f0f2f5;}
        .header{background:#2c3e66;color:white;padding:15px;text-align:center;}
        .nav a{color:white;text-decoration:none;margin:0 15px;}
        .container{max-width:1000px;margin:0 auto;padding:40px 20px;}
        h1{text-align:center;color:#2c3e66;margin-bottom:10px;}
        .subtitle{text-align:center;color:#666;margin-bottom:40px;}
        .contacts-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;}
        .info-card{background:white;padding:30px;border-radius:15px;}
        .info-card h2{margin-bottom:20px;color:#2c3e66;}
        .info-list{list-style:none;}
        .info-list li{padding:12px 0;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:15px;}
        .form-group{margin-bottom:20px;}
        label{display:block;margin-bottom:8px;font-weight:bold;}
        input,textarea,select{width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;}
        input:focus,textarea:focus{outline:none;border-color:#e67e22;}
        .btn-submit{background:#e67e22;color:white;border:none;padding:12px 30px;border-radius:25px;cursor:pointer;width:100%;}
        .btn-submit:hover{background:#b85e0a;}
        .form-status{margin-top:20px;padding:12px;border-radius:10px;display:none;text-align:center;}
        .form-status.success{display:block;background:#d4edda;color:#155724;}
        .form-status.error{display:block;background:#f8d7da;color:#721c24;}
        .footer{background:#1a2a44;color:white;text-align:center;padding:30px;margin-top:30px;}
        @media (max-width:768px){.contacts-grid{grid-template-columns:1fr;}}
    </style>
</head>
<body>
    <header class="header">
        <h1>🎧 ЗвукоСлово</h1>
        <nav class="nav">
            <a href="index.html">Главная</a>
            <a href="catalog.html">Каталог</a>
            <a href="contacts.html">Контакты</a>
        </nav>
    </header>
    
    <div class="container">
        <h1>📬 Свяжитесь с нами</h1>
        <p class="subtitle">Мы всегда рады помочь</p>
        
        <div class="contacts-grid">
            <div class="info-card">
                <h2>Наши контакты</h2>
                <ul class="info-list">
                    <li><span style="font-size:1.5rem;">📍</span> г. Москва, ул. Книжная, 15</li>
                    <li><span style="font-size:1.5rem;">📞</span> +7 (495) 123-45-67</li>
                    <li><span style="font-size:1.5rem;">✉️</span> info@zvukoslovo.ru</li>
                    <li><span style="font-size:1.5rem;">🕐</span> Пн-Пт: 10:00 - 20:00</li>
                </ul>
            </div>
            
            <div class="info-card">
                <h2>Напишите нам</h2>
                <form id="contactForm">
                    <div class="form-group"><label>Имя *</label><input type="text" id="name" required placeholder="Ваше имя"></div>
                    <div class="form-group"><label>Email *</label><input type="email" id="email" required placeholder="email@example.com"></div>
                    <div class="form-group"><label>Сообщение *</label><textarea id="message" rows="4" required placeholder="Ваше сообщение"></textarea></div>
                    <button type="submit" class="btn-submit">✉️ Отправить</button>
                    <div id="formStatus" class="form-status"></div>
                </form>
            </div>
        </div>
    </div>
    
    <footer class="footer">
        <p>© 2025 ЗвукоСлово — библиотека аудиокниг</p>
    </footer>
    
    <script>
        document.getElementById('contactForm').addEventListener('submit',function(e){
            e.preventDefault();
            var name=document.getElementById('name').value;
            var email=document.getElementById('email').value;
            var msg=document.getElementById('message').value;
            var status=document.getElementById('formStatus');
            if(name && email && email.includes('@') && msg){
                status.className='form-status success';
                status.textContent='✓ Спасибо! Сообщение отправлено.';
                this.reset();
                setTimeout(function(){status.className='form-status';},3000);
            }else{
                status.className='form-status error';
                status.textContent='✗ Заполните все поля.';
                setTimeout(function(){status.className='form-status';},3000);
            }
        });
    </script>
</body>
</html>
